# AI workflow - deterministic gates around agent hand-offs.
#
# This workflow does NOT start OpenHands agents. Reliable agent dispatch depends on
# the installed OpenHands version and is introduced in later phases (docs/automation.md).
# Until then, humans start agent conversations and this workflow enforces the
# deterministic parts of the hand-off contract:
#
#   Issue labeled ai-ready  -> task-readiness: every required task section is present,
#                              otherwise ai-ready is removed and the Issue returns to the Planner.
#   Pull Request events     -> pull-request-conventions: Conventional Commits title and
#                              commits, branch name, exactly one closing keyword whose Issue number
#                              matches the branch, template sections, at most one agent:* label;
#                              the job summary names the Agent Profile that owns the next step.
#
# Intended flow (agents perform the semantic work, Actions the deterministic checks):
#   Issue labeled ai-ready -> Developer -> Branch -> Implementation -> Tests -> Pull Request -> Reviewer
#   Pull Request -> GitHub Actions (build, lint, tests) + AI Reviewer
#
# Security: only `issues` and `pull_request` events are used (never `pull_request_target`),
# untrusted text is read from the event payload inside JavaScript and never interpolated
# into shell commands, and each job requests the minimum permissions it needs.
# The section names below are verified against .github/ISSUE_TEMPLATE/task.yml and
# .github/pull_request_template.md by scripts/validate_repository.py.

name: ai-workflow

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

jobs:
  task-readiness:
    name: task-readiness
    if: github.event_name == 'issues' && github.event.label.name == 'ai-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Verify the task contains every required section
        uses: actions/github-script@v9
        with:
          script: |
            const required = [
              'Context', 'Objective', 'Scope', 'Out of scope', 'Technical approach',
              'Dependencies', 'Acceptance criteria', 'Testing requirements', 'Definition of Done',
            ];
            const issue = context.payload.issue;
            const body = (issue.body || '').replace(/\r\n/g, '\n').replace(/<!--[\s\S]*?-->/g, '');
            const escape = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            const contentOf = (section) => {
              const heading = new RegExp(`^#{2,3}\\s+${escape(section)}\\s*$`, 'im');
              const match = heading.exec(body);
              if (!match) return null;
              const rest = body.slice(match.index + match[0].length);
              const next = rest.search(/^#{1,3}\s+\S/m);
              return (next === -1 ? rest : rest.slice(0, next)).trim();
            };

            const missing = required.filter((section) => {
              const content = contentOf(section);
              return content === null || content === '' || content === '_No response_';
            });

            if (missing.length === 0) {
              core.summary
                .addHeading('Task is ready for development')
                .addRaw(`Issue #${issue.number} contains every required section. `)
                .addRaw('Next: start the `developer` Agent Profile with the Developer activation prompt (agents/developer.md).')
                .write();
              return;
            }

            const { owner, repo } = context.repo;
            const labels = issue.labels.map((l) => l.name);
            await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'ai-ready' });
            if (labels.includes('agent:developer')) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'agent:developer' });
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['agent:planner'] });
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: [
                '**Readiness check** · ai-workflow · state: planning',
                '',
                '`ai-ready` was removed because these required sections are missing or empty:',
                '',
                ...missing.map((s) => `- ${s}`),
                '',
                'Complete them (see skills/planning/SKILL.md) and add `ai-ready` again.',
              ].join('\n'),
            });
            core.setFailed(`Task #${issue.number} is missing sections: ${missing.join(', ')}`);

  pull-request-conventions:
    name: pull-request-conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check title, branch, closing keyword, commits, template and labels
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            // HTML comments are template guidance (they contain examples such as "Closes #122")
            // and are ignored by GitHub, so they are ignored here too.
            const body = (pr.body || '').replace(/\r\n/g, '\n').replace(/<!--[\s\S]*?-->/g, '');
            const title = pr.title || '';
            const branch = pr.head.ref;
            const problems = [];

            const automated = /^(dependabot|renovate)\//.test(branch);
            const types = 'feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert';
            const conventional = new RegExp(`^(${types})(\\([a-z0-9][a-z0-9-]*\\))?!?: [a-z0-9].*[^.\\s]$`);
            const isConventional = (line) => line.length <= 72 && conventional.test(line);
            const form = '<type>(<scope>): <description> (72 characters at most), for example "feat(timer): add rest countdown (#42)"';

            if (!automated) {
              if (!isConventional(title)) {
                problems.push(`The title "${title}" does not follow Conventional Commits: ${form}.`);
              }

              const branchMatch = /^(feature|bugfix|refactor|chore|docs)\/([0-9]+)-[a-z0-9]+(-[a-z0-9]+)*$/.exec(branch);
              if (!branchMatch) {
                problems.push(`Branch "${branch}" does not match <feature|bugfix|refactor|chore|docs>/<issue-number>-<short-description>.`);
              }

              const closed = new Set();
              const closing = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:[\w.-]+\/[\w.-]+)?#(\d+)/gi;
              for (const m of body.matchAll(closing)) closed.add(m[1]);
              if (closed.size !== 1) {
                problems.push(`The description must link exactly one Issue with a closing keyword (for example "Closes #42"); found ${closed.size}.`);
              } else if (branchMatch && !closed.has(branchMatch[2])) {
                problems.push(`The branch names Issue #${branchMatch[2]} but the Pull Request closes #${[...closed][0]}. One Pull Request per task Issue.`);
              }

              const sections = [
                'Summary', 'Related Issue', 'Changes', 'Architecture impact', 'Tests',
                'Security considerations', 'Documentation', 'Breaking changes', 'Checklist',
              ];
              for (const section of sections) {
                if (!new RegExp(`^##\\s+${section}\\s*$`, 'm').test(body)) {
                  problems.push(`Missing template section "## ${section}".`);
                }
              }

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const bad = [];
              for (const c of commits) {
                if ((c.parents || []).length > 1) continue; // merge commits are squashed away on merge
                const subject = c.commit.message.split('\n')[0];
                if (!isConventional(subject)) bad.push(`${c.sha.slice(0, 7)} ${subject}`);
              }
              if (bad.length) {
                problems.push(`Commits that do not follow Conventional Commits:\n${bad.slice(0, 10).map((b) => `  - ${b}`).join('\n')}`);
              }
            }

            const labelNames = pr.labels.map((l) => l.name);
            const agentLabels = labelNames.filter((n) => n.startsWith('agent:'));
            const parallelReview = agentLabels.length === 2
              && agentLabels.includes('agent:reviewer') && agentLabels.includes('agent:security');
            if (agentLabels.length > 1 && !parallelReview) {
              problems.push(`More than one agent:* label: ${agentLabels.join(', ')}. Exactly one agent owns a Pull Request, except agent:reviewer with agent:security during parallel review.`);
            }
            if (labelNames.includes('changes-requested')) {
              problems.push('QA or a reviewer requested changes (label changes-requested). Address the findings first.');
            }

            const profiles = {
              'agent:developer': 'developer',
              'agent:qa': 'qa-engineer',
              'agent:reviewer': 'code-reviewer',
              'agent:security': 'security-reviewer',
            };
            const labels = pr.labels.map((l) => l.name);
            let next = 'No agent label: the Orchestrator or a human assigns the next owner.';
            if (agentLabels.length === 1) {
              const profile = profiles[agentLabels[0]];
              next = profile
                ? `Next: start the \`${profile}\` Agent Profile with its activation prompt (agents/${profile}.md).`
                : `Label ${agentLabels[0]} is not a Pull Request stage; check config/workflow.yaml.`;
            } else if (parallelReview) {
              next = 'Parallel review in progress: code-reviewer and security-reviewer.';
            } else if (labels.includes('needs-human')) {
              next = 'Awaiting a human decision (needs-human). Only a human code owner approves and merges.';
            }

            core.summary.addHeading(`Pull Request #${pr.number} conventions`);
            if (problems.length) {
              core.summary.addList(problems);
            } else {
              core.summary.addRaw('All conventions satisfied. ');
            }
            core.summary.addRaw(next).write();

            if (problems.length) {
              const message = problems.join('\n');
              if (pr.draft) {
                core.warning(`Draft Pull Request - fix before marking ready:\n${message}`);
              } else {
                core.setFailed(message);
              }
            }
