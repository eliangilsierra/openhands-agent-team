# Validates this repository deterministically. It never calls OpenHands or any AI
# service, so the repository stays verifiable when the agent platform is offline.
#
# Checks (see scripts/validate_repository.py for details):
#   - required directories and files exist and are not empty
#   - YAML and JSON parse
#   - Markdown internal links and anchors resolve; Mermaid blocks are well-formed
#   - agent profiles, Skills, ADRs, Issue forms and the PR template have the required structure
#   - config/*.yaml are mutually consistent (agents, skills, workflow, permissions)
#   - shared vocabulary is used consistently
#   - no secrets, secret-bearing files, placeholder markers or application source code
#   - Markdown style (markdownlint) and workflow syntax (actionlint)
#   - mocked-event tests of the pull request scripts, the Claude Code hook tests and shellcheck

name: validate-repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-repository:
    name: validate-repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check "pyyaml==6.0.3"

      - name: Validate structure, configuration, links and secrets
        run: python scripts/validate_repository.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"

      - name: Test pull request workflow scripts
        run: node scripts/test_workflows.mjs

      - name: Test Claude Code hooks and git hooks
        run: node templates/runtime/claude/hooks/test-hooks.mjs

      - name: Check git hooks with shellcheck
        run: shellcheck templates/runtime/claude/githooks/commit-msg templates/runtime/claude/githooks/pre-push

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
