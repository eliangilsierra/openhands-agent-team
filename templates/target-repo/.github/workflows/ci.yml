# Build, lint and test for a Node.js project worked on by the agent team.
# Copy to .github/workflows/ci.yml of the project (humans add workflow files) and mark the job
# "ci" as a required status check of main. Adjust the commands to the project's package.json.
# Each step is skipped while the repository has no package.json yet.

name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        # npm ci needs a lockfile; projects without one fall back to npm install.
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint

      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test -- --run

      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build

      - name: No project yet
        if: hashFiles('package.json') == ''
        run: echo "No package.json yet; nothing to build."
