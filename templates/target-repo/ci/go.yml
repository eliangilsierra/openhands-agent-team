# Vet, test with the race detector and build a Go module for a project worked on by the agent team.
# Copy to .github/workflows/ci.yml of the project (humans add workflow files) and mark the job
# "ci" as a required status check of main. Adjust the commands to the project; they should match the
# commands detect_stack.py reports (skills/stack-routing), so developers run locally what CI runs.

name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...
